name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Version PR or publish
    if: github.repository == 'nocpiun/gitlab-ui-react'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use pnpm 10.33.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11.19.0 for trusted publishing
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm exec tsc --project tsconfig.json --noEmit

      - name: Run lint
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm playwright:install

      - name: Run tests
        run: pnpm test

      - name: Build and verify publishable packages
        run: pnpm release:prepare

      - name: Generate changeset from Conventional Commits
        run: pnpm release:changeset

      - name: Create version PR or publish packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: "chore: version packages"
          commit: "chore: version packages"
          commitMode: github-api
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
